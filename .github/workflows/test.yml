name: Test snapshot refresh
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify price providers, routes and failure preservation
        run: node --test tests/*.test.mjs
      - name: Verify all four Excel files and input-only preservation
        run: python3 tests/excel_prices_test.py
