name: Refresh stock route liquidity
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-route-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify aggregation and failure preservation
        run: node tests/refresh-stock-routes.test.mjs
      - name: Refresh public liquidity snapshot
        run: node scripts/refresh_stock_routes.mjs --universe asset-universe.json --snapshot stock-route-data.json
      - name: Commit completed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-route-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh stock quote route liquidity"
            git push
          fi
